name: Parallax quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  lint:
    name: ESLint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PARALLAX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:changed

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  artifact:
    name: Build deployable site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npm run site:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-site-${{ env.CANDIDATE_SHA }}
          path: .parallax-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  browser_plan:
    name: Browser verification plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - id: plan
        name: Select affected browser shards
        env:
          PARALLAX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PARALLAX_VERIFY_ALL_SHARDS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: echo "shards=$(node scripts/browser/verification-plan.mjs)" >> "$GITHUB_OUTPUT"

  browser_shard:
    name: Browser verification (${{ matrix.shard }})
    needs: [artifact, unit, browser_plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.browser_plan.outputs.shards) }}
    env:
      PARALLAX_ARTIFACT_ROOT: .parallax-artifact
      PARALLAX_VERIFY_SKIP_UNIT_TESTS: '1'
      PARALLAX_VERIFY_SHARD: ${{ matrix.shard }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: parallax-site-${{ env.CANDIDATE_SHA }}
          path: .parallax-artifact
      - run: npm run site:verify
      - name: Confirm system Chrome
        run: test -x "$PUPPETEER_EXECUTABLE_PATH"
      - run: npm run verify
      - name: Preserve browser failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-browser-verification-${{ matrix.shard }}-${{ env.CANDIDATE_SHA }}
          path: verify-out/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Full browser verification
    if: always()
    needs: [browser_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: test "$SHARD_RESULT" = "success"
