name: Parallax quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  governance:
    name: Governance safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run governance:check
      - run: npm run governance:pr

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Full browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Confirm system Chrome
        run: test -x "$PUPPETEER_EXECUTABLE_PATH"
      - run: npm run verify
      - name: Preserve browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-browser-verification
          path: verify-out/
          if-no-files-found: warn
          retention-days: 14
