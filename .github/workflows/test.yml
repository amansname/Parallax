name: Parallax quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  lint:
    name: ESLint
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PARALLAX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:changed

  unit:
    name: Unit tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  artifact:
    name: Build deployable site artifact
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npm run site:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-site-${{ env.CANDIDATE_SHA }}
          path: .parallax-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  browser-groups:
    name: Browser contracts (${{ matrix.group }})
    permissions:
      contents: read
    needs: [artifact, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [entry, wizard-runtime, wizard-forms, scenarios, cashflow, persistence]
    env:
      PARALLAX_ARTIFACT_ROOT: .parallax-artifact
      PARALLAX_VERIFY_SKIP_UNIT_TESTS: '1'
      PARALLAX_VERIFY_BROWSER_GROUP: ${{ matrix.group }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: parallax-site-${{ env.CANDIDATE_SHA }}
          path: .parallax-artifact
      - run: npm run site:verify
      - name: Confirm system Chrome
        run: test -x "$PUPPETEER_EXECUTABLE_PATH"
      - run: npm run verify
      - name: Preserve browser failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-browser-verification-${{ env.CANDIDATE_SHA }}-${{ matrix.group }}
          path: verify-out/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Full browser verification
    permissions:
      contents: read
    needs: [artifact, unit, browser-groups]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser group and its prerequisites
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.NEEDS_RESULTS);
          for (const job of ['artifact', 'unit', 'browser-groups']) {
            if (results[job]?.result !== 'success') {
              console.error(`${job}: ${results[job]?.result ?? 'missing'}`);
              process.exitCode = 1;
            }
          }
          NODE
